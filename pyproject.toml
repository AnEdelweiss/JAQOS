[project]
name = "SIMPLE"
version = "0.20.0"
description = """SIMPLE, a Command Line Interface coded in python with a focus on ease of use, rapidity and flexibility.This tool will ( I hope ) help researchers uppload MIAPPE compliant phenotyping data on OpenSilex instances."""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "certifi==2026.5.20",
    "lxml==6.1.1",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "numpy==2.4.6",
    "openpyxl>=3.1.5",
    "opensilexclienttoolspython",
    "pandas==3.0.3",
    "pygments==2.20.0",
    "pyinstaller>=6.21.0",
    "python-dateutil==2.9.0.post0",
    "requests>=2.34.2",
    "rich==15.0.0",
    "six==1.17.0",
    "urllib3==2.7.0",
]

[project.scripts]
simple = "simple.__main__:main"

[tool.uv]
package = true

[tool.uv.sources]
opensilexclienttoolspython = { git = "https://github.com/OpenSILEX/opensilexClientToolsPython.git", rev = "e26032c2620ec0a142c0601f43b83566788c4a25" }

[tool.uv.workspace]
members = [
    "SIMPLE",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pytest>=9.1.1",
]

[tool.coverage.run]
source = ["simple"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/console.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"
