on:
  workflow_dispatch:
    inputs:
      version:
        description: "SIMPLE"
        required: true
        
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install base dependencies
        run: uv pip install --system .

      - name: Build CLI executable
        run: pyinstaller --onefile --name SIMPLE --icon=docs/simple.ico src/simple/__main__.py 

      - name: Install GUI dependencies
        run: uv pip install --system pyqt6

      - name: Create GUI entry script
        run: |
          cat << 'EOF' > launch_gui.py
          import sys
          import simple.__main__
          import runpy
          
          if '--gui' not in sys.argv:
              sys.argv.append('--gui')
              
          runpy.run_module('simple.__main__', run_name='__main__')
          EOF
        shell: bash

      - name: Build GUI executable
        run: pyinstaller --onefile --windowed --name SIMPLE-gui --icon=docs/simple.ico launch_gui.py 

      - name: Rename executables
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/SIMPLE dist/SIMPLE-linux
            mv dist/SIMPLE-gui dist/SIMPLE-gui-linux
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Make files executable (Linux)
        run: chmod +x SIMPLE-linux SIMPLE-gui-linux || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: true
          files: |
            SIMPLE-linux
            SIMPLE.exe
            SIMPLE-gui-linux
            SIMPLE-gui.exe
